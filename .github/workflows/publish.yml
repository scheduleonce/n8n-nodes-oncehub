# Publishes this n8n community node package to npm on every version tag push.
#
# Uses OIDC trusted publishing — no long-lived npm tokens required.
# Provenance attestations are generated automatically.
#
# ─── PREREQUISITES ─────────────────────────────────────────────────────────────
#
# @n8n/node-cli ≥ 0.23.0 is required. Check with:  npm list @n8n/node-cli
# Trusted publisher must be configured on npmjs.com for this workflow.
#
# ─── TAG CONVENTION ────────────────────────────────────────────────────────────
#
# Triggers on tags matching "*.*.*" (e.g. 0.2.0).
# For "v" prefix tags (e.g. v0.2.0), change the filter to: ['v*.*.*']
#
# ─── RELEASE PROCESS ───────────────────────────────────────────────────────────
#
# Run locally:  npm run release
# This lints, builds, prompts for a version bump, updates the changelog,
# commits, tags, and pushes — triggering this workflow to publish to npm.

name: Publish

on:
  push:
    tags:
      # Matches 0.1.0, 1.2.3, 2.0.0-rc.1, etc.
      # See "TAG CONVENTION" above if you prefer tags with a "v" prefix.
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Release
        # Publishes to npm via OIDC trusted publishing with provenance attestation.
        # Lint and build run automatically as part of the release process.
        run: npm run release